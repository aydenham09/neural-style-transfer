# Metadata Referensi Gaya Lukisan untuk Neural Style Transfer
# Karakteristik visual membantu dalam penentuan layer VGG-19 dan bobot transfer gaya.

van_gogh:
  title: "Wheat Field with Cypresses"
  artist: "Vincent van Gogh"
  year: 1889
  movement: "Post-Impressionism"
  key_visual_features:
    - "Sapuan kuas tebal melengkung berputar (impasto technique)"
    - "Palet warna hangat kuning gandum berpadu dengan hijau tua pohon cemara dan biru langit turbulen"
    - "Fokus gaya: Tekstur kuas dinamis di layer conv1_1 sampai conv3_1"
  recommended_style_layers: ["conv_1_1", "conv_2_1", "conv_3_1", "conv_4_1", "conv_5_1"]
  default_style_weight: 1.0e6

hokusai:
  title: "The Great Wave off Kanagawa"
  artist: "Katsushika Hokusai"
  year: 1831
  movement: "Ukiyo-e (Edo Woodblock Print)"
  key_visual_features:
    - "Garis kontur hitam tegas (linear woodblock line art)"
    - "Busa ombak berujung cakar (claw-like spray)"
    - "Palet warna terbatas: Prussian Blue, krem kertas washi, dan putih busa"
    - "Fokus gaya: Garis tepi tajam dan bidang warna datar (flat color fills)"
  recommended_style_layers: ["conv_1_1", "conv_2_1", "conv_3_1", "conv_4_1"]
  default_style_weight: 5.0e5

kandinsky:
  title: "Composition 8"
  artist: "Wassily Kandinsky"
  year: 1923
  movement: "Abstract / Bauhaus"
  key_visual_features:
    - "Elemen geometris tajam: lingkaran, segitiga, garis lurus bersilangan, checkerboard"
    - "Kontras warna primer dan sekunder yang kontras tinggi di atas latar krem netral"
    - "Fokus gaya: Fitur representasi bentuk tingkat menengah ke tinggi (conv3_1, conv4_1)"
  recommended_style_layers: ["conv_2_1", "conv_3_1", "conv_4_1", "conv_5_1"]
  default_style_weight: 2.0e6

